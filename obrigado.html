<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pagamento Confirmado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f9fc;
      color: #333;
      text-align: center;
      padding: 60px 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    h1 {
      color: #27ae60;
    }
    p {
      margin: 16px 0;
      font-size: 18px;
    }
    a.button {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      color: white;
      background: #27ae60;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    a.button:hover {
      background: #1f9450;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ Pagamento Confirmado!</h1>
    <p>Recebemos seu pagamento com sucesso.</p>
    <p>Você receberá um e-mail com os detalhes da sua reserva em instantes.</p>
    <a class="button" href="/">Voltar para o site</a>
  </div>
</body>
</html>
